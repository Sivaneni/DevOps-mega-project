apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ingress
  namespace: {{ .Values.namespace.name }}
  annotations:
    cert-manager.io/cluster-issuer: kubeissuer
spec:
  tls:
  - hosts:
    - bankapp.prasannasivaneni.click
    secretName: bankapp-tls-secret
  ingressClassName: nginx
  rules:
  - host: www.hitservicelab.xyz
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: bankapp-service
            port:
              number: 8080        
